name: 毎日ゴールデンクロス スキャン

on:
  schedule:
    # 大引け前スキャン：14:20 JST 開始 → メール 14:50 JST ごろ着（05:20 UTC）
    - cron: '20 5 * * 1-5'
    # 大引け後スキャン：16:15 JST（終値確定後）（07:15 UTC）
    - cron: '15 7 * * 1-5'
  workflow_dispatch:

jobs:
  scan-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ライブラリ インストール
        run: pip install yfinance pandas pyarrow requests playwright google-api-python-client youtube-transcript-api google-generativeai

      - name: Playwright ブラウザ インストール
        run: playwright install chromium --with-deps

      - name: JPX400 スキャン実行
        run: python scan_jpx400.py

      - name: SP500 スキャン実行
        run: python scan_sp500.py

      - name: 商品先物 スキャン実行
        run: python scan_commodities.py

      - name: HTML図解スクリーンショット撮影
        run: python screenshot.py

      - name: GC追跡・勝率集計
        run: python track_gc.py

      - name: 結果をまとめてコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ data/ --ignore-errors
          git diff --staged --quiet || git commit -m "scan: $(date '+%Y-%m-%d %H:%M') JST"
          git push

      - name: メール送信（CSV・スクリーンショット添付・YouTube要約）
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python send_mail.py
