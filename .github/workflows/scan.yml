name: 毎日ゴールデンクロス スキャン

on:
  schedule:
    - cron: '15 7 * * 1-5'
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  scan-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ライブラリ インストール
        run: pip install yfinance pandas pyarrow

      - name: JPX400 スキャン実行
        run: python scan_jpx400.py

      - name: SP500 スキャン実行
        run: python scan_sp500.py

      - name: 結果をまとめてコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ data/
          git diff --staged --quiet || git commit -m "scan: $(date '+%Y-%m-%d %H:%M') JST"
          git push

      - name: メール送信（CSV添付）
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python send_mail.py
