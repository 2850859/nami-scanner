name: 毎日ゴールデンクロス スキャン

on:
  schedule:
    - cron: '15 7 * * 1-5'
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  scan-jpx400:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas
      - run: python scan_jpx400.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add results/
          git diff --staged --quiet || git commit -m "scan: JPX400 $(date '+%Y-%m-%d %H:%M') JST"
          git push

  scan-sp500:
    needs: scan-jpx400
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas
      - run: python scan_sp500.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add results/
          git diff --staged --quiet || git commit -m "scan: SP500 $(date '+%Y-%m-%d %H:%M') JST"
          git push
