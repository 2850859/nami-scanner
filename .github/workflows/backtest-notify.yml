# バックテスト完了後、同一ジョブ内ですぐ Resend でメール通知（余計な待ちなし）
name: バックテスト → メール通知

on:
  schedule:
    # おまかせ: 毎週日曜 21:00 JST（12:00 UTC）· 負荷と通知の頻度のバランス
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      tickers:
        description: "銘柄コード（スペース区切り）例: 7203.T 9984.T"
        required: true
        default: "7203.T"
      period:
        description: "取得期間（yfinance）例: 3y / 5y"
        required: true
        default: "3y"

jobs:
  backtest-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係インストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy yfinance requests

      - name: バックテスト実行 → 終了直後にメール（--notify）
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          set -eux
          # 手動実行時は入力値、schedule 時はおまかせ既定（日本株メジャー3 + 3年）
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TICKERS="${{ github.event.inputs.tickers }}"
            PERIOD="${{ github.event.inputs.period }}"
          else
            TICKERS="7203.T 6758.T 9984.T"
            PERIOD="3y"
          fi
          python -m trade_rules.run_cleartrade_yfinance \
            --tickers ${TICKERS} \
            --period "${PERIOD}" \
            --out-dir results \
            --notify
